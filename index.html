<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ntlas</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="promo.mp4" type="video/mp4">
        </video>
    </div>

    <nav class="navbar">
        <div class="contact-links">
            <a href="https://wa.me/22230726475" class="glow">WhatsApp: +22230726475</a>
            <span class="sep">|</span>
            <a href="mailto:ntlas.mc@gmail.com" class="glow">mohamed005cheikh@gmail.com</a>
        </div>
    </nav>

    <main class="wrapper">
        <div class="glass-card">
            <h1 class="title"> Ntlas</h1>
            <p class="tagline"></p>

            <div class="input-area">
                <input type="text" id="qr-input" placeholder="ألصق الرابط هنا...">
                <button onclick="generateQR()" class="btn-main">توليد QR</button>
            </div>

            <div id="result-panel" style="display: none;">
                <div class="options">
                    <select id="frame-type" onchange="applyStyle()">
                        <option value="none">بدون إطار</option>
                        <option value="square">إطار مربع نيون</option>
                        <option value="round">إطار دائري نيون</option>
                    </select>
                    <input type="color" id="frame-color" value="#00d2ff" onchange="applyStyle()">
                </div>

                <div id="qr-export-zone">
                    <div id="qr-wrapper">
                        <div id="qrcode"></div>
                        <img src="logo.png" id="qr-logo" alt="Logo">
                    </div>
                </div>

                <button class="btn-download" onclick="downloadQR()">تحميل الرمز النهائي</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 mohamed005cheikh@gmail.com | by MC</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
